<main>
    <section>
      <h2>VRTennis: VR Game</h2>
      <div class="description">
        <p>A VR game built for Meta Quest 3 simulating tennis gameplay with CPU opponents, realistic physics, and interactive scorekeeping.</p>
        <p style="font-size: 1rem;"><strong>Technologies Used:</strong> Unity, OpenXR, XR Interaction Toolkit</p>
      </div>
      <div class="slideshow-container">
        <button class="prev" onclick="plusSlides(-1)">&#10094;</button>
      
        <!-- Slide 1: YouTube video -->
        <div class="slide">
          <iframe
            src="https://www.youtube.com/embed/TQ0T2TRbkCc"
            title="YouTube Shorts video"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
            style="width: 100%; max-width: 600px; height: 500px; display: block; margin: 0 auto; border-radius: 15px;"
          ></iframe>
        </div>
      
        <!-- Slide 2: menu img -->
        <div class="slide">
            <img src="../src/vrtennis/menu.png" alt="Menu" style="width: 100%; max-width: 600px; height: auto; display: block; margin: 0 auto; border-radius: 15px;">
        </div>
      
        <!-- Slide 3: bot -->
        <div class="slide">
          <img src="../src/vrtennis/opponent.png" alt="Opponent" style="width: 100%; max-width: 600px; height: auto; display: block; margin: 0 auto; border-radius: 15px;">
        </div>
      
        <button class="next" onclick="plusSlides(1)">&#10095;</button>
      </div>
      
      <div class="slide-counter" id="slide-counter">1 of 3</div>
    </section>
</main>
